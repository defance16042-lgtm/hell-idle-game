name: Package Game

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package game
        run: |
          mkdir -p dist
          zip -r dist/hell-idle-game.zip . \
            -x ".git/*" \
            -x "dist/*"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: hell-idle-game-package
          path: dist/hell-idle-game.zip
          if-no-files-found: error
