name: Build Windows Installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare cropped monster sprites
        run: |
          python -m pip install pillow
          python scripts/trim_parallel_general_body_frames.py
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Windows installer
        run: npm run dist:win -- --publish never
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Hell-Idle-Game-Setup
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
